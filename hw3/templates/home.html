

<!doctype html>
<html lang="en">
<head><title>Art search</title></head>
<body>
  <h1>Art Search</h1>

   {% if message %}
    <p>{{ message }}</p>
  {% endif %}

  <form action="/arts" method="get">
    <label for="artist_title">Title</label>
    <input id="artist_title" name="artist_title_search">
    <button type="submit">Find art</button>
  </form>
</body>
</html>
