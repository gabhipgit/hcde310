<!doctype html>
<html lang="en">
<head><title>Art by {{ artist_title }}</title></head>
<body>
  <h1>Art by {{ artist_title }}</h1>

  {% if message %}
    <p>{{ message }}</p>
  {% endif %}

  <ul>
  {% for art in arts %}
    <li>{{ art.title }}</li>
  {% endfor %}
  </ul>
  <a href="/">New search</a>
</body>
</html>
